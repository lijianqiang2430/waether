# 流水线名称
name: Pytest自动化测试CI

# 触发条件：代码提交到master分支，自动运行流水线
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 流水线任务
jobs:
  test:
    # 运行环境：云端Linux服务器
    runs-on: ubuntu-latest

    # 执行步骤
    steps:
      # 1. 拉取GitHub上的代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装Python环境
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 修改：GitHub 没有 3.14，必须改成 3.11

      # 3. 安装项目依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest  # 增加：强制安装，确保不报错

      # ===================== 以下是新增的 Allure 配置 =====================
      # 4. 安装 Allure 命令行工具
      - name: 安装 Allure CLI
        run: |
          curl -o allure.zip -L https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip
          mv allure-2.29.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      # 5. 【核心】运行pytest + 生成Allure测试数据
      - name: 执行自动化测试并生成报告数据
        run: pytest -v --alluredir=./allure-results

      # 6. 生成Allure HTML可视化报告
      - name: 生成Allure测试报告
        run: allure generate ./allure-results -o ./allure-report --clean

      # 7. 上传报告，方便下载查看
      - name: 上传Allure报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report