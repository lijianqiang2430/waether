# 流水线名称
name: Pytest自动化测试CI

# 触发条件：代码提交到main分支，自动运行流水线
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 流水线任务
jobs:
  test:
    # 运行环境：云端Linux服务器
    runs-on: ubuntu-latest

    # 执行步骤
    steps:
      # 1. 拉取GitHub上的代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装Python环境
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'  # 你的Python版本

      # 3. 安装项目依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ===================== 以下是新增的 Allure 配置 =====================
      # 4. 安装 Allure 命令行工具
      - name: 安装 Allure
        uses: simple-elf/allure-action@v2
        with:
          allure-version: '2.30.0'

      # 5. 【核心】运行pytest + 生成Allure测试数据
      - name: 执行自动化测试并生成报告数据
        run: pytest -v --alluredir=./allure-results

      # 6. 生成Allure HTML可视化报告
      - name: 生成Allure测试报告
        run: allure generate ./allure-results -o ./allure-report --clean

      # 7. 上传报告，方便下载查看
      - name: 上传Allure报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report